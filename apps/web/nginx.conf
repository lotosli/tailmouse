worker_processes 1;
pid /tmp/tailmouse-nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        application/wasm wasm;
        image/svg+xml svg;
        image/png png;
        image/webp webp;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    gzip_static on;
    gzip_vary on;
    client_body_temp_path /tmp/tailmouse-client-body;

    map $uri $tailmouse_cache_control {
        default "no-cache";
        "~^/(assets|tailcat)/[\w.-]+-[\w-]{8,}\.(js|css|wasm|svg|png|webp|woff2)$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(self), gyroscope=(self), magnetometer=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $tailmouse_cache_control always;

        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
        }
        location ~ /\. { return 404; }
    }
}
