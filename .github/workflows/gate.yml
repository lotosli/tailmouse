name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 270
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - name: Preserve upstream source line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
      - name: Verify native Windows ARM64 toolchains
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node_arch = node -p 'process.arch'
          if ($LASTEXITCODE -ne 0 -or $node_arch -ne 'arm64') {
            throw 'Windows ARM64 requires native ARM64 Node.js.'
          }
          $go_arch = go env GOHOSTARCH GOARCH
          if ($LASTEXITCODE -ne 0 -or ($go_arch -join ',') -ne 'arm64,arm64') {
            throw 'Windows ARM64 requires native ARM64 Go and test binaries.'
          }
          # The image's GCC targets x64. Match our CGO-free ARM64 release;
          # native Go tests still run, including upstream C API core tests.
          'CGO_ENABLED=0' >> $env:GITHUB_ENV
      - name: Verify Windows native Go acceptance
        if: runner.os == 'Windows'
        env:
          GOWORK: 'off'
        run: node tools/go-gate.mjs coverage
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps
      - if: runner.os != 'Linux'
        run: pnpm exec playwright install
      - run: pnpm gate
        env:
          # Hosted Ubuntu restricts user namespaces through AppArmor. These
          # browser fixtures serve only the local test application.
          TAILMOUSE_TEST_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Install verified release tools
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          release_tools="$(mktemp -d "$RUNNER_TEMP/tailmouse-release.XXXXXX")"
          goreleaser_version="$(node -p "require('./tooling/versions.json').goreleaser")"
          cyclonedx_version="$(node -p "require('./tooling/versions.json').cyclonedx")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-time 120 --max-filesize 134217728 \
            "https://github.com/goreleaser/goreleaser/releases/download/v${goreleaser_version}/goreleaser_Linux_x86_64.tar.gz" \
            --output "$release_tools/goreleaser.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-time 120 --max-filesize 134217728 \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${cyclonedx_version}/cyclonedx-linux-x64" \
            --output "$release_tools/cyclonedx"
          printf '%s  %s\n' \
            '41cdf49b653784b03a08013dd99e382cd5d463049e915c2d818eaed182ae6197' "$release_tools/goreleaser.tar.gz" \
            'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746' "$release_tools/cyclonedx" \
            | sha256sum --check --strict -
          tar -xzf "$release_tools/goreleaser.tar.gz" -C "$release_tools" goreleaser
          chmod 755 "$release_tools/goreleaser" "$release_tools/cyclonedx"
          printf '%s\n' "$release_tools" >> "$GITHUB_PATH"
      - name: Build six native snapshot archives
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: pnpm release:snapshot
      - name: Generate per-artifact SBOMs
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: pnpm release:sbom
      - name: Independently verify the distribution
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          pnpm release:verify
          cd .artifacts/distribution
          sha256sum --check --strict checksums.txt
      - name: Check source and submodule cleanliness
        shell: bash
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$source_status"
          tailcat_status="$(git -C third_party/tailcat status --porcelain=v1 --untracked-files=all)"
          test -z "$tailcat_status"

  fuzz:
    name: Go fuzz smoke
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm fuzz:smoke
